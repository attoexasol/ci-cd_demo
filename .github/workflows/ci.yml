name: CI CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build website
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/style.css
          test -f dist/app.js

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: dist/
          if-no-files-found: error

  deploy:
    name: Deploy to Windows PC
    needs: test-and-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: [self-hosted, Windows, X64, cicd-demo-host]

    permissions:
      actions: read
      contents: read

    steps:
      - name: Download website artifact
        uses: actions/download-artifact@v4
        with:
          name: website-build
          path: website-build

      - name: Deploy website
        shell: cmd
        run: |
          if not exist "website-build\index.html" exit /b 1
          if not exist "D:\CECD\website" mkdir "D:\CECD\website"
          xcopy "website-build\*" "D:\CECD\website\" /E /I /Y
          if errorlevel 1 exit /b 1

      - name: Verify deployment
        shell: cmd
        run: |
          if not exist "D:\CECD\website\index.html" exit /b 1
          if not exist "D:\CECD\website\style.css" exit /b 1
          if not exist "D:\CECD\website\app.js" exit /b 1
          echo Deployment verified successfully!
